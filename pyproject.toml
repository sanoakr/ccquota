[project]
name = "ccquota"
version = "0.3.0"
description = "CLI tool to display Claude usage quota from claude.ai"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "SANO Akira", email = "sano@math.ryukoku.ac.jp" }]
keywords = ["claude", "anthropic", "usage", "quota", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "curl-cffi>=0.15.0",
    "playwright>=1.58.0",
]

[project.urls]
Repository = "https://github.com/sanoakr/ccquota"

[project.scripts]
ccquota = "ccquota:main"
