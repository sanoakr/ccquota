[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccquota"
version = "0.5.3"
description = "CLI tool to display Claude usage quota from claude.ai"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "SANO Akira", email = "sano@maica.org" }]
keywords = ["claude", "anthropic", "usage", "quota", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "playwright>=1.58.0",
]

[project.urls]
Repository = "https://github.com/sanoakr/ccquota"

[project.scripts]
ccquota = "ccquota:main"
